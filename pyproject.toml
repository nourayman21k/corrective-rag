[project]
name = "corrective-rag"
version = "0.1.0"
description = "Corrective RAG (CRAG) over ML research papers with LangGraph, Groq and a Streamlit UI"
readme = "README.md"
authors = [
    { name = "nourayman21k", email = "nour.ayman.fcis@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "arxiv<3",
    "chroma>=0.2.0",
    "ddgs>=9.16.0",
    "docx2txt>=0.9",
    "faiss-cpu>=1.15.1",
    "fastapi>=0.142.2",
    "langchain>=1.4.0",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.3",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.2",
    "langchain-ollama>=1.1.0",
    "langchain-openrouter>=0.2.9",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.11",
    "mcp>=2.2.0",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.3",
    "sentence-transformers>=6.1.0",
    "streamlit>=1.65.0",
    "torch>=2.14.1",
    "uvicorn>=0.53.0",
    "wikipedia>=1.4.0",
]

[project.scripts]
corrective-rag = "corrective_rag:main"

[dependency-groups]
dev = [
    "comm>=0.2.3",
    "ipykernel>=7.3.0",
]

# CPU-only PyTorch: avoids pulling the multi-GB CUDA build on Linux (Docker)
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
